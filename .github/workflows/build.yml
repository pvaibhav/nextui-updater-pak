name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test package isolation and launcher
        run: python3 scripts/test_package.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Test firmware release selection
        run: cargo test --locked

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git --locked

      - name: Build with cross
        run: cross build --locked --release --target=aarch64-unknown-linux-gnu

      - name: Package
        run: bash scripts/create_pak.sh

      - name: Upload updater package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextui.updater.pakz
          path: nextui.updater.pakz
          if-no-files-found: error
